name: "HCL AppScan DAST Action"
on:
  workflow_dispatch
jobs:
  scan:
    runs-on: self-hosted
    steps:
      - name: PWVER
        run: Get-Host | Select-Object Version
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run ASoC DAST Scan
        uses: karlskorner/forked-dast-action@main
        with:
          baseurl:  https://cloud.appscan.com
          asoc_key: ${{secrets.ASOC_KEY}}
          asoc_secret: ${{secrets.ASOC_SECRET}}
          application_id: bc5951db-9d71-4140-90d0-d6b739f11992
          scan_name: "DAST from GitHub"
          dynamic_scan_type: dast
          starting_URL: https://demo.testfire.net
          fail_for_noncompliance: false
          wait_for_analysis: false
